
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vạn Tiên Môn</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  color:#f8e9bd;
  font-family:Georgia,serif;
  background:linear-gradient(145deg,#080617,#21102e,#090817);
  min-height:100vh;
}
header{
  text-align:center;
  padding:28px 12px;
  background:linear-gradient(90deg,#25113c,#6c3b21,#25113c);
  border-bottom:2px solid #d6ad56;
}
h1{
  color:#ffe5a0;
  font-size:32px;
  margin:0 0 8px;
  text-shadow:0 0 15px #e8ae4b;
}
.subtitle{color:#e9cda0}
.container{max-width:850px;margin:auto;padding:15px}
.panel{
  background:#171225dd;
  border:1px solid #a77c45;
  border-radius:14px;
  padding:16px;
  margin:14px 0;
  box-shadow:0 0 15px #0008;
}
h2{
  color:#f2cf83;
  font-size:20px;
  margin-top:0;
}
input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #bd9453;
  background:#0e0b19;
  color:white;
  margin:6px 0 10px;
}
button{
  border:1px solid #e5bd70;
  background:linear-gradient(120deg,#75451e,#bd873b);
  color:white;
  padding:11px 14px;
  border-radius:8px;
  font-weight:bold;
  margin:4px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat{
  background:#251a37;
  padding:14px;
  border-radius:10px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:22px;
  color:#ffe5a0;
  margin-top:5px;
}
#ranking{padding:0;list-style:none}
#ranking li{
  padding:12px;
  border-bottom:1px solid #59442f;
}
.gold{color:#ffdb79}
#status{color:#b8e7b2}
</style>
</head>
<body>

<header>
  <h1>☯ VẠN TIÊN MÔN ☯</h1>
  <div class="subtitle">Tiên Ma Song Cảnh · Thiên Địa Tranh Phong</div>
  <p>Chưởng môn: Nguyễn Thanh Sơn</p>
  <div id="status">Đang kết nối tiên giới...</div>
</header>

<main class="container">

<section class="panel">
  <h2>🏯 Nhập Môn</h2>
  <input id="discipleName" placeholder="Nhập đạo hiệu của bạn">
  <button onclick="join()">Bái nhập sơn môn</button>
</section>

<section class="panel">
  <h2>✨ Tiên Mệnh</h2>
  <div class="stats">
    <div class="stat">Số đệ tử<strong id="count">0</strong></div>
    <div class="stat">Cảnh giới cao nhất<strong id="highest">Phàm Nhân</strong></div>
  </div>
</section>

<section class="panel">
  <h2>⚔️ Thử luyện tu tiên</h2>
  <p>Những nút dưới đây dùng để thử nghiệm hệ thống.</p>
  <button onclick="demo('demoJoin')">Nhập môn</button>
  <button onclick="demo('demoChat')">Trò chuyện +10</button>
  <button onclick="demo('demoLike')">Thả tim +100</button>
  <button onclick="demo('demoGift')">Tiên lễ +500</button>
</section>

<section class="panel">
  <h2>📜 Bảng Thiên Kiêu</h2>
  <ol id="ranking"></ol>
</section>

<section class="panel">
  <h2>🌌 Cảnh giới tu luyện</h2>
  <div id="realms"></div>
</section>

</main>

<script>
const socket = io();
let disciples = [];
let realms = [];

socket.on("connect",()=>{
  document.getElementById("status").textContent="● Tiên giới đã kết nối";
});

socket.on("disconnect",()=>{
  document.getElementById("status").textContent="Đang mất kết nối...";
});

socket.on("initialData",(data)=>{
  disciples=data.disciples || [];
  realms=data.realms || [];
  render();
});

socket.on("joined",(data)=>{
  disciples=data.disciples;
  render();
});

socket.on("cultivation",(data)=>{
  disciples=data.disciples;
  render();
});

function join(){
  const name=document.getElementById("discipleName").value.trim();
  if(!name){
    alert("Vui lòng nhập đạo hiệu!");
    return;
  }
  socket.emit("demoJoin",name);
}

function demo(action){
  const name=document.getElementById("discipleName").value.trim() || "Đệ tử thử nghiệm";
  socket.emit(action,name);
}

function render(){
  document.getElementById("count").textContent=disciples.length;

  const sorted=[...disciples].sort((a,b)=>b.power-a.power);
  document.getElementById("highest").textContent=sorted[0]?.realm || "Phàm Nhân";

  document.getElementById("ranking").innerHTML=sorted.map((d,i)=>
    `<li><span class="gold">#${i+1}</span> ${escapeHTML(d.name)} — ${escapeHTML(d.realm)} · ${d.power} linh lực</li>`
  ).join("") || "<li>Chưa có đệ tử nhập môn.</li>";

  document.getElementById("realms").innerHTML=realms.map(r=>
    `<p>✦ ${escapeHTML(r.name)} — ${r.power} linh lực</p>`
  ).join("");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}
</script>
</body>
</html>
